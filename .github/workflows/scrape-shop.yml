name: Scrape shop.gplxlife.com
on:
  push:
    paths:
      - .github/workflows/scrape-shop.yml
      - tools/scrape-shop.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Crawl shop
        run: node tools/scrape-shop.js
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add shop-snapshot
          git commit -m "Snapshot of shop.gplxlife.com" || echo "nothing to commit"
          git pull --rebase
          git push
